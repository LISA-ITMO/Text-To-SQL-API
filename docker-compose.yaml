services:
  qdrant:
    image: qdrant/qdrant:latest
    restart: always
    container_name: qdrant
    ports:
      - 6333:6333
      - 6334:6334
    expose:
      - 6333
      - 6334
      - 6335
    volumes:
      - ./qdrant_data:/qdrant/storage

  text-to-sql-api:
    build:
      context: ./
      dockerfile: dockerfile
    container_name: text-to-sql-api
    restart: always
    depends_on:
      qdrant:
        condition: service_started
    ports:
      - "8000:8000"
    volumes:
      - ./models:/models