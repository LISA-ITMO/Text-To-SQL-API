<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport"
            content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
        <meta http-equiv="X-UA-Compatible" content="ie=edge">
        <title>Text-To-SQL Master</title>
        <link rel="stylesheet" type="text/css" href="../static/styles_main.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Faster+One&display=swap" rel="stylesheet">
    </head>

    <body>
        <div class="container">
            <h1>TEXT-TO-SQL Master</h1>
            <!-- Область чата с прокруткой -->
            <div class="chat-container" id="chatContainer">
                <div class="messages-area" id="messagesArea">
                    <!-- Сюда будут добавляться сообщения -->
                </div>
            </div>

            <!-- Форма для ввода вопроса -->
            <form id="QuestionForm" class="input-form">
                <div class="input-group">
                    <textarea type="text" id="question" name="question" class="question-input" placeholder="Введите ваш вопрос..." required></textarea>
                    <button type="submit" id="btn_submit" class="btn_submit" onclick="submitFunction(event)">Отправить</button>
                </div>
            </form>
        </div>

        <div id="settingsModal" class="modal">
            <div class="modal-content">
                <div class="modal-header">
                    <h2>Настройки</h2>
                    <span class="close-btn" id="closeSettingsModal">&times;</span>
                </div>
                <div class="modal-tabs">
                    <button class="tab-btn active" data-tab="general">Общие настройки</button>
                    <button class="tab-btn" data-tab="llm">LLM</button>
                    <button class="tab-btn" data-tab="rag">RAG</button>
                </div>
                <div class="modal-body">
                    <!-- Вкладка "Общие настройки" -->
                    <div id="tab-general" class="tab-content active">
                        <!-- Переключатель Модель LLM -->
                        <div class="setting-item">
                            <label class="setting-label">Модель LLM</label>
                            <div class="mode-switch">
                                <span id="labelLocal" class="mode-label active">Локальная модель</span>
                                <label class="toggle-switch">
                                    <input type="checkbox" id="llmModeToggle">
                                    <span class="slider"></span>
                                </label>
                                <span id="labelServer" class="mode-label">Серверная модель</span>
                            </div>
                            <!-- Блок локальной модели -->
                            <div id="localModelBlock" class="model-block">
                                <div class="input-field">
                                    <label>Путь к модели (URL)</label>
                                    <input type="text" id="localUrl" class="modal-input" placeholder="Введите путь или URL...">
                                </div>
                                <div class="checkbox-item">
                                    <input type="checkbox" id="hfCheckbox">
                                    <label for="hfCheckbox">Скачать модель с Hugging Face</label>
                                </div>
                                <div id="hfFilenameBlock" class="input-field hidden">
                                    <label>Название файла модели</label>
                                    <input type="text" id="hfFilename" class="modal-input" placeholder="например, model.Q4_K_M.gguf">
                                </div>
                                <button id="connectLocalModel" class="btn_connect">Подключить модель</button>
                            </div>
                            <!-- Блок серверной модели -->
                            <div id="serverModelBlock" class="model-block hidden">
                                <div class="input-field">
                                    <label>URL сервера *</label>
                                    <input type="text" id="serverUrl" class="modal-input" placeholder="https://api.example.com">
                                </div>
                                <div class="input-field">
                                    <label>API Key (опционально)</label>
                                    <input type="text" id="serverApiKey" class="modal-input" placeholder="sk-...">
                                </div>
                                <div class="input-field">
                                    <label>Название модели (опционально)</label>
                                    <input type="text" id="serverModel" class="modal-input" placeholder="gpt-3.5-turbo">
                                </div>
                                <button id="connectServerModel" class="btn_connect">Подключить модель</button>
                            </div>
                        </div>
                        
                        <!-- Переключатель Использовать RAG -->
                        <div class="setting-item">
                            <label class="setting-label">Использовать RAG</label>
                            <label class="toggle-switch">
                                <input type="checkbox" id="ragToggle" checked>
                                <span class="slider"></span>
                            </label>
                            <span class="toggle-hint">(поиск по базе знаний для улучшения SQL)</span>
                        </div>
                    </div>

                    <!-- Вкладка LLM -->
                    <div id="tab-llm" class="tab-content">
                        <p class="dev-placeholder">🚧 В разработке</p>
                    </div>
                    <!-- Вкладка RAG -->
                    <div id="tab-rag" class="tab-content">
                        <p class="dev-placeholder">🚧 В разработке</p>
                    </div>
                </div>
            </div>
        </div>

        <div class="btn_options_container">
            <button type="submit" id="btn_options" class="btn_options" onclick=""><img src="..\static\icons\settings.png" width="50%"></a></button>
        </div>

        <div id="devContainer" class="cb_developers_container_hidden">
            <input type="checkbox" id="cb_developers" class="cb_developers">
            <label for="cb_developers">Режим разработчика</label>
            <p><textarea type="text" id="sql_question" name="question" class="sql-question-input" placeholder="Введите SQL-запрос..."></textarea>
            <p><button type="submit" id="sql_btn_submit" class="sql_btn_submit" onclick="submitFunction2(event)">Выполнить SQL</button>
        </div>

        <script src="../static/js/script.js"></script>
    </body>
</html>
